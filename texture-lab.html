<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>Texture Lab</title><style>body{margin:0;background:#111;color:#eee;font-family:sans-serif}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;padding:16px}.card{background:#1c1c1c;padding:10px;border-radius:10px}canvas{width:100%;image-rendering:auto}</style></head><body><div style="padding:16px"><button id="refresh">刷新种子</button></div><div class="grid" id="grid"></div><script type="module">import {makeAllTexturePreview} from './src/utils/textures.js';let seed=1;function draw(){grid.innerHTML='';const all=makeAllTexturePreview('lab-'+seed);for(const [name,t] of Object.entries(all)){const card=document.createElement('div');card.className='card';card.innerHTML='<b>'+name+'</b>';card.appendChild(t.image);grid.appendChild(card)}}refresh.onclick=()=>{seed++;draw()};draw();</script></body></html>
