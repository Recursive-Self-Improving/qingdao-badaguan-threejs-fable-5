<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>青島 · 八大關</title>
    <style>
      html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#07111b;color:#f7f1e6;font-family:"Noto Serif SC", "Songti SC", serif;}
      canvas{display:block;width:100%;height:100%;}
      #overlay{position:fixed;inset:0;pointer-events:none;}
      #loading{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#18344e,#07111b 70%);transition:opacity .6s;}
      #loading.hidden{opacity:0;pointer-events:none;}
      .loading-card{text-align:center;min-width:320px}.title{font-size:42px;letter-spacing:.18em}.subtitle{opacity:.75;margin-top:10px}.bar{height:6px;background:#22384b;border-radius:99px;margin-top:24px;overflow:hidden}.bar>span{display:block;height:100%;width:0;background:#ffc773;transition:width .25s}.step{font-size:12px;margin-top:10px;opacity:.8}
      #startButton{margin-top:24px;padding:12px 26px;border:1px solid #f5f2ea;background:rgba(10,18,28,.74);color:#f5f2ea;border-radius:999px;font-size:18px;cursor:pointer;pointer-events:auto}.hidden #startButton{display:none}
      #hud{position:absolute;inset:0;pointer-events:none}.road-name{position:absolute;left:24px;bottom:26px;transform:rotate(-8deg);font-size:22px;text-shadow:0 2px 10px #000}.help{position:absolute;right:24px;bottom:22px;font:14px system-ui,sans-serif;opacity:.82;text-align:right}.presets{position:absolute;right:22px;top:18px;display:flex;gap:8px;pointer-events:auto}.presets button{color:#fff;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.45);border-radius:10px;padding:8px 10px;cursor:pointer}.presets button.active{background:#ffc773;color:#1a1a1a}
      #toast{position:absolute;left:50%;top:16%;transform:translateX(-50%);background:rgba(7,17,27,.72);backdrop-filter:blur(8px);padding:18px 28px;border:1px solid rgba(255,255,255,.2);border-radius:16px;text-align:center;opacity:0;transition:opacity .25s}.toast-title{font-size:28px}.toast-body{font:14px system-ui,sans-serif;margin-top:6px;color:#eee}
      #pause{position:absolute;inset:0;display:none;place-items:center;background:rgba(2,6,10,.62);pointer-events:auto}#pause.show{display:grid}.pause-card{max-width:520px;padding:28px;background:rgba(15,24,34,.9);border:1px solid rgba(255,255,255,.2);border-radius:18px}.pause-card button{padding:10px 18px;border-radius:999px;border:0;background:#ffc773}
      #touchHint{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);font:14px system-ui,sans-serif;background:rgba(0,0,0,.45);padding:8px 12px;border-radius:999px;display:none}.coarse #touchHint{display:block}.joystick{position:absolute;left:28px;bottom:118px;width:104px;height:104px;border:1px solid rgba(255,255,255,.35);border-radius:50%;display:none}.coarse .joystick{display:block}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay">
      <div id="loading"><div class="loading-card"><div class="title">青島 · 八大關</div><div class="subtitle">紅瓦綠樹 · 碧海藍天</div><div class="bar"><span id="progressBar"></span></div><div class="step" id="loadingStep">准备场景</div><button id="startButton" hidden>开始游览</button></div></div>
      <div id="hud"><div class="road-name" id="roadName">居庸关路</div><div class="presets" id="presetButtons"><button data-preset="dusk" class="active">1 黄昏</button><button data-preset="day">2 晴午</button><button data-preset="fog">3 海雾</button></div><div class="help">WASD 移动 · Shift 跑步 · 鼠标视角<br/>1/2/3 切换氛围 · Esc 帮助</div></div>
      <div id="toast"><div class="toast-title"></div><div class="toast-body"></div></div>
      <div id="pause"><div class="pause-card"><h2>游览帮助</h2><p>点击继续后锁定鼠标。WASD/方向键移动，Shift 跑步，1/2/3 切换黄昏、晴午、海雾。</p><p>移动端建议桌面体验；触摸设备可拖动右半屏转视角。</p><button id="resumeButton">继续</button></div></div>
      <div id="touchHint">建议桌面体验；触摸设备可拖动右半屏转视角</div><div class="joystick" id="joystick"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
